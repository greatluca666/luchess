<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title data-i18n="title.game">luchess - Game</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/chessground/chessground.base.css" />
  <link rel="stylesheet" href="/chessground/chessground.brown.css" />
  <link rel="stylesheet" href="/chessground/chessground.cburnett.css" />
  <link rel="stylesheet" href="/piece-icons.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-icon" aria-hidden="true"></span><span>luchess</span></a>
    <button type="button" class="lang-toggle"></button>
  </header>
  <div class="page page-wide">
    <div class="game-layout card">
      <div class="board-col">
        <div id="invite-panel" class="invite-panel" hidden>
          <p data-i18n="game.waiting">Waiting for opponent — share the room number or this link:</p>
          <p class="room-code-line"><span data-i18n="game.roomNumber">Room number</span> <strong id="room-code" class="room-code"></strong></p>
          <div class="invite-row">
            <input id="invite-link" type="text" readonly />
            <button id="copy-invite-btn" data-i18n="game.copyInvite">Copy invite link</button>
          </div>
        </div>
        <div id="variant-label" class="variant-label"></div>
        <div id="captured-top" class="captured"></div>
        <div class="clock" id="clock-top">--:--</div>
        <div id="board" class="cg-wrap"></div>
        <div class="clock" id="clock-bottom">--:--</div>
        <div id="captured-bottom" class="captured"></div>
      </div>
      <div class="side-col">
        <div class="controls">
          <button id="resign-btn" data-i18n="game.resign">Resign</button>
          <button id="draw-btn" data-i18n="game.draw">Draw</button>
          <button id="undo-btn" data-i18n="game.undo">Undo</button>
          <button id="rematch-btn" hidden>Rematch</button>
        </div>
        <div id="error-msg" class="error-msg" hidden></div>
        <div id="offer-banner" class="offer-banner" hidden></div>
        <ol id="move-list" class="move-list"></ol>
      </div>
    </div>
  </div>
  <script type="module" src="/game.js"></script>
</body>
</html>
