<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title data-i18n="title.history">luchess - Game history</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/chessground/chessground.base.css" />
  <link rel="stylesheet" href="/chessground/chessground.brown.css" />
  <link rel="stylesheet" href="/chessground/chessground.cburnett.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-icon" aria-hidden="true"></span><span>luchess</span></a>
    <button type="button" class="lang-toggle"></button>
  </header>
  <div class="page page-wide">
    <h1 data-i18n="history.title">Game history</h1>
    <div class="card history-layout">
      <div class="list-col">
        <ul id="games-list"></ul>
      </div>
      <div class="replay-col">
        <div id="replay-board" class="cg-wrap"></div>
        <div class="controls">
          <button id="replay-prev" data-i18n="history.previous">Previous</button>
          <button id="replay-next" data-i18n="history.next">Next</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/games.js"></script>
</body>
</html>
