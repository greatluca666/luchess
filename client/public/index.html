<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>luchess</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/piece-icons.css" />
</head>
<body>
  <div class="page page-wide">
    <header class="home-header">
      <h1>luchess</h1>
      <p class="tagline">Play chess with friends — no ads, no sign-up, just share a link and start</p>
    </header>

    <div class="hero">
      <div class="deco-board-outer" aria-hidden="true">
        <div class="deco-board" id="deco-board"></div>
      </div>

      <main class="card create-form">
        <label>
          Time control
          <select id="time-control">
            <option value="0">Unlimited</option>
            <option value="300000">5+0</option>
            <option value="600000">10+0</option>
            <option value="900000">15+0</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <div id="custom-time-wrap" class="custom-time-wrap" hidden>
          <label>
            Custom minutes
            <input type="number" id="custom-time-minutes" min="1" max="180" value="20" />
          </label>
          <label>
            Increment per move
            <input type="number" id="custom-increment-seconds" min="0" max="60" value="0" />
          </label>
        </div>
        <label>
          Playing side
          <select id="color-pref">
            <option value="random">Random</option>
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </label>
        <label>
          Variant
          <select id="variant">
            <option value="chess">Standard</option>
            <option value="chess960">Chess960</option>
            <option value="3check">Three-check</option>
            <option value="kingofthehill">King of the Hill</option>
            <option value="atomic">Atomic</option>
            <option value="antichess">Antichess</option>
            <option value="racingkings">Racing Kings</option>
            <option value="horde">Horde</option>
          </select>
        </label>
        <button id="create-btn">Create game</button>
        <p><a href="/games">Game history</a></p>
      </main>
    </div>

    <div class="variant-grid" id="variant-tiles">
      <button type="button" class="variant-tile" data-value="chess" aria-pressed="true">
        <span class="tile-head"><span class="tag">STD</span><span class="name">Standard</span></span>
        <span class="desc">Classic chess rules — no extra setup needed</span>
      </button>
      <button type="button" class="variant-tile" data-value="chess960">
        <span class="tile-head"><span class="tag">960</span><span class="name">Random start</span></span>
        <span class="desc">Chess960, with the back rank randomized each game</span>
      </button>
      <button type="button" class="variant-tile" data-value="3check">
        <span class="tile-head"><span class="tag">+3</span><span class="name">Three checks</span></span>
        <span class="desc">Check the king three times to win</span>
      </button>
      <button type="button" class="variant-tile" data-value="kingofthehill">
        <span class="tile-head"><span class="tag">KH</span><span class="name">King of the Hill</span></span>
        <span class="desc">Move your king into one of the central four squares to win</span>
      </button>
      <button type="button" class="variant-tile" data-value="atomic">
        <span class="tile-head"><span class="tag">ATM</span><span class="name">Atomic</span></span>
        <span class="desc">Captured pieces explode and take nearby units with them</span>
      </button>
      <button type="button" class="variant-tile" data-value="antichess">
        <span class="tile-head"><span class="tag">ANTI</span><span class="name">Antichess</span></span>
        <span class="desc">Capture is mandatory — the first side to lose all pieces wins</span>
      </button>
      <button type="button" class="variant-tile" data-value="racingkings">
        <span class="tile-head"><span class="tag">RACE</span><span class="name">Racing Kings</span></span>
        <span class="desc">No checks allowed — the first king to reach the 8th rank wins</span>
      </button>
      <button type="button" class="variant-tile" data-value="horde">
        <span class="tile-head"><span class="tag">HORDE</span><span class="name">Horde</span></span>
        <span class="desc">White has 36 pawns against black's standard army</span>
      </button>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
